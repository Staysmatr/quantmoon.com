<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantMoon</title>
    <meta name="description" content="QuantMoon. Coming soon." />
    <meta name="theme-color" content="#191919" />
    <meta name="robots" content="max-image-preview:none" />
    <meta name="googlebot" content="noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:title" content="QuantMoon" />
    <meta property="og:description" content="Coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quantmoon.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QuantMoon" />
    <meta name="twitter:description" content="Coming soon." />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="canonical" href="https://quantmoon.com/" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #191919;
        --ink: rgba(255, 255, 255, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Avenir Next", Avenir, "Century Gothic", Futura, "Trebuchet MS", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(880px, calc(100% - 2.5rem));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(2.25rem, 6vh, 3.5rem);
        padding: 2.5rem 0 3rem;
      }

      h1 {
        margin: 0;
        width: 100%;
      }

      .mark {
        position: relative;
        width: 100%;
      }

      .mark img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 6624 / 992;
        pointer-events: none;
        -webkit-user-drag: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .mark img:not([src]) {
        visibility: hidden;
      }

      .shield {
        position: absolute;
        inset: 0;
        background: transparent;
      }

      p {
        margin: 0;
        color: var(--ink);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.46em;
        text-indent: 0.46em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      @media (max-width: 520px) {
        p {
          font-size: 0.68rem;
          letter-spacing: 0.32em;
          text-indent: 0.32em;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .mark,
        p {
          animation: rise 1.15s ease both;
        }

        p {
          animation-delay: 0.18s;
        }
      }

      @media print {
        .mark {
          visibility: hidden;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="mark">
        <img id="mark" alt="QuantMoon" width="6624" height="992" draggable="false" />
        <span class="shield" aria-hidden="true"></span>
      </h1>
      <p>Coming soon</p>
    </main>
    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var file = reduce ? "mark-still.dat" : "mark.dat";
        var type = reduce ? "image/png" : "image/gif";
        var key = new Uint8Array([23, 124, 177, 203, 224, 94, 87, 217, 23, 20, 247, 76, 181, 148, 0, 84]);
        var img = document.getElementById("mark");
        var mark = document.querySelector(".mark");

        function block(event) {
          event.preventDefault();
        }

        mark.addEventListener("contextmenu", block);
        mark.addEventListener("dragstart", block);
        mark.addEventListener("copy", block);
        document.addEventListener("dragstart", block);

        fetch(file)
          .then(function (response) {
            if (!response.ok) throw new Error("missing");
            return response.arrayBuffer();
          })
          .then(function (buffer) {
            var bytes = new Uint8Array(buffer);
            for (var i = 0; i < bytes.length; i++) bytes[i] ^= key[i % key.length];
            img.src = URL.createObjectURL(new Blob([bytes], { type: type }));
          })
          .catch(function () {
            img.alt = "QuantMoon";
          });
      })();
    </script>
  </body>
</html>
